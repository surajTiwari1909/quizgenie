name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: Checks and Docker build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: quiz_game_test
          POSTGRES_USER: quiz_user
          POSTGRES_PASSWORD: quiz_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quiz_user -d quiz_game_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://quiz_user:quiz_password@localhost:5432/quiz_game_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run lint, tests, and Django checks
        run: make check

      - name: Build Docker image
        run: docker build --tag quizgenie:ci .
